<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pakistan Bus Game 🇵🇰</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MAIN MENU
    ========================== -->

    <div id="mainMenu" class="screen">

        <div class="menu-overlay">

            <div class="logo">
                🇵🇰
                <span>PAKISTAN</span>
                <b>BUS GAME</b>
            </div>

            <p class="subtitle">
                Drive Pakistan • Explore Cities • Complete Routes
            </p>

            <button onclick="startGame()">
                🚌 PLAY GAME
            </button>

            <button onclick="openCityMenu()">
                🗺️ MAP
            </button>

            <button onclick="showComingSoon('Bus Garage')">
                🚍 BUS GARAGE
            </button>

            <button onclick="showComingSoon('Career Mode')">
                🏆 CAREER
            </button>

            <button onclick="showComingSoon('Tour Mode')">
                🌍 TOUR
            </button>

        </div>

    </div>


    <!-- =========================
         CITY MENU
    ========================== -->

    <div id="cityMenu" class="screen hidden">

        <div class="city-panel">

            <h1>🇵🇰 PAKISTAN MAP</h1>

            <p>Select your city</p>

            <div id="cityList"></div>

            <button class="back-button" onclick="backToMenu()">
                ⬅ BACK
            </button>

        </div>

    </div>


    <!-- =========================
         GAME
    ========================== -->

    <div id="gameUI" class="hidden">

        <div id="threeContainer"></div>


        <!-- TOP HUD -->

        <div class="top-hud">

            <div>
                📍
                <span id="currentCity">
                    Kamalia
                </span>
            </div>

            <div>
                💰 Rs.
                <span id="money">
                    5000
                </span>
            </div>

            <div>
                ⛽
                <span id="fuel">
                    100
                </span>%
            </div>

        </div>


        <!-- SPEED -->

        <div class="speedometer">

            <span id="speed">
                0
            </span>

            <small>
                KM/H
            </small>

        </div>


        <!-- ROUTE -->

        <div class="route-box">

            📍

            <span id="destination">
                Kamalia City
            </span>

        </div>


        <!-- MOBILE CONTROLS -->

        <div class="controls">

            <div class="left-controls">

                <button
                    id="leftBtn"
                    class="control-btn"
                >
                    ◀
                </button>

                <button
                    id="rightBtn"
                    class="control-btn"
                >
                    ▶
                </button>

            </div>


            <div class="right-controls">

                <button
                    id="brakeBtn"
                    class="control-btn brake"
                >
                    🛑
                </button>

                <button
                    id="gasBtn"
                    class="control-btn gas"
                >
                    🚀
                </button>

                <button
                    id="hornBtn"
                    class="control-btn"
                >
                    📯
                </button>

            </div>

        </div>


        <!-- EXIT -->

        <button
            class="exit-game"
            onclick="exitGame()"
        >
            ✕
        </button>

    </div>


    <!-- THREE.JS -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

    <script src="game.js"></script>

</body>
</html>
